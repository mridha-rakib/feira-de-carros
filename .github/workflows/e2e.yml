name: E2E Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright E2E (Web & Admin)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers & Linux OS Dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Build applications
        run: pnpm build

      - name: Run Playwright E2E Tests
        run: pnpm test:e2e
        env:
          CI: true

      - name: Upload Playwright Reports & Failure Artifacts
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-test-artifacts
          path: |
            playwright-report/
            apps/admin/playwright-report/
            apps/admin/test-results/
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14
