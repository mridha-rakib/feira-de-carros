<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B111E"/>
      <stop offset="50%" stop-color="#151D2F"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="motoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F42524" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#E11D48" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <line x1="80" y1="460" x2="720" y2="460" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 6"/>
  <ellipse cx="400" cy="470" rx="260" ry="22" fill="#F42524" opacity="0.12"/>

  <!-- Motorcycle Silhouette -->
  <g transform="translate(200, 180)">
    <!-- Rear Wheel -->
    <circle cx="80" cy="240" r="48" fill="#0F172A" stroke="#475569" stroke-width="8"/>
    <circle cx="80" cy="240" r="22" fill="#1E293B" stroke="#F42524" stroke-width="3"/>
    
    <!-- Front Wheel -->
    <circle cx="340" cy="240" r="48" fill="#0F172A" stroke="#475569" stroke-width="8"/>
    <circle cx="340" cy="240" r="22" fill="#1E293B" stroke="#F42524" stroke-width="3"/>

    <!-- Fork & Handlebar -->
    <line x1="340" y1="240" x2="280" y2="80" stroke="#94A3B8" stroke-width="8" stroke-linecap="round"/>
    <line x1="270" y1="80" x2="295" y2="70" stroke="#E2E8F0" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Frame & Engine -->
    <path d="M 80,240 
             L 160,230 
             L 200,160 
             L 270,110 
             L 230,120 
             L 180,130 
             L 130,150 
             L 80,180 Z" 
          fill="url(#motoGrad)"/>

    <!-- Gas Tank -->
    <path d="M 200,125 C 220,105 255,100 270,115 L 240,145 L 190,140 Z" fill="#F42524"/>

    <!-- Seat -->
    <path d="M 130,145 C 150,140 180,140 200,145 L 190,160 L 130,155 Z" fill="#0F172A" stroke="#334155" stroke-width="2"/>

    <!-- Exhaust Pipe -->
    <path d="M 180,230 L 220,235 L 120,250 L 70,250" fill="none" stroke="#64748B" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- Typography & Badges -->
  <rect x="250" y="70" width="300" height="34" rx="17" fill="#F42524" opacity="0.15"/>
  <rect x="250" y="70" width="300" height="34" rx="17" fill="none" stroke="#F42524" stroke-width="1.5"/>
  <text x="400" y="92" text-anchor="middle" fill="#FCA5A5" font-family="system-ui, sans-serif" font-size="12" font-weight="800" letter-spacing="1.5">CATEGORIA: MOTOCICLETA</text>

  <text x="400" y="525" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="18" font-weight="900" letter-spacing="2">FEIRA DE CARROS • VEÍCULO DEMO</text>
  <text x="400" y="550" text-anchor="middle" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12" font-weight="500">Ativo ilustrativo de demonstração • Aguardando sessão fotográfica</text>
</svg>
