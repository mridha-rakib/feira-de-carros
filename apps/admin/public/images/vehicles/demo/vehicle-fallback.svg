<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B111E"/>
      <stop offset="50%" stop-color="#161F30"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="carGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F42524" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#E11D48" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)"/>
  
  <!-- Subtle Grid lines -->
  <line x1="100" y1="460" x2="700" y2="460" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- Glowing spotlight on floor -->
  <ellipse cx="400" cy="470" rx="260" ry="24" fill="#F42524" opacity="0.12"/>

  <!-- Car Silhouette / Vector Art -->
  <g transform="translate(180, 200)">
    <!-- Car Body -->
    <path d="M40,180 
             L60,130 
             C70,105 110,65 160,55 
             L250,50 
             C300,50 340,80 370,120 
             L410,140 
             C425,145 440,160 440,180 
             L440,210 
             C440,220 430,225 420,225 
             L380,225 
             C380,195 355,170 325,170 
             C295,170 270,195 270,225 
             L170,225 
             C170,195 145,170 115,170 
             C85,170 60,195 60,225 
             L20,225 
             C10,225 0,218 0,205 
             L0,190 
             C0,180 15,175 40,180 Z" 
          fill="url(#carGrad)" opacity="0.95"/>

    <!-- Windows & Roofline -->
    <path d="M165,65 
             L245,62 
             C285,62 315,85 340,115 
             L280,115 
             L160,115 
             C135,115 120,95 135,80 Z" 
          fill="#0B111E" opacity="0.75"/>
    
    <path d="M195,115 L260,115 L245,70 L195,72 Z" fill="#38BDF8" opacity="0.25"/>
    <path d="M270,115 L335,115 C315,92 295,74 265,71 L252,71 Z" fill="#38BDF8" opacity="0.3"/>

    <!-- Headlight -->
    <polygon points="415,145 440,165 425,175 405,160" fill="#FDE047" opacity="0.9" filter="url(#glow)"/>

    <!-- Wheels -->
    <!-- Front Wheel -->
    <circle cx="325" cy="225" r="38" fill="#1E293B" stroke="#475569" stroke-width="4"/>
    <circle cx="325" cy="225" r="22" fill="#0F172A" stroke="#94A3B8" stroke-width="2"/>
    <circle cx="325" cy="225" r="8" fill="#E2E8F0"/>

    <!-- Rear Wheel -->
    <circle cx="115" cy="225" r="38" fill="#1E293B" stroke="#475569" stroke-width="4"/>
    <circle cx="115" cy="225" r="22" fill="#0F172A" stroke="#94A3B8" stroke-width="2"/>
    <circle cx="115" cy="225" r="8" fill="#E2E8F0"/>
  </g>

  <!-- Typography & Badge -->
  <text x="400" y="505" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC" letter-spacing="1.5">
    FEIRA DE CARROS • VEÍCULO DEMO
  </text>
  <text x="400" y="528" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#94A3B8">
    Ativo demonstrativo aguardando fotos originais do anunciante
  </text>
</svg>
